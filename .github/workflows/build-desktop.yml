name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Create .env file
        run: |
          cat > src-tauri/.env << EOF
          SHARED_SECRETS=${{ secrets.SHARED_SECRETS }}
          PROXY_BASEROW_URL=${{ secrets.PROXY_BASEROW_URL }}
          PROXY_BREVO_URL=${{ secrets.PROXY_BREVO_URL }}
          EOF

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build Tauri app
        run: pnpm tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: mates-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            !src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Create .env file
        run: |
          cat > src-tauri/.env << EOF
          SHARED_SECRETS=${{ secrets.SHARED_SECRETS }}
          PROXY_BASEROW_URL=${{ secrets.PROXY_BASEROW_URL }}
          PROXY_BREVO_URL=${{ secrets.PROXY_BREVO_URL }}
          EOF

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build Android APK
        env:
          MATES_ANDROID_KEYSTORE: /tmp/keystore.jks
          MATES_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MATES_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MATES_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm android:build:signed

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mates-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mates-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lhR

      - uses: softprops/action-gh-release@v3
        with:
          files: ./*
          generate_release_notes: true
